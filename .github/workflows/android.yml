name: Android TV APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android scaffold and configure Shizuku bridge
        run: |
          rm -rf /tmp/tv-scaffold
          flutter create --platforms=android --org com.hyouka --project-name hyouka_tv_control --android-language kotlin /tmp/tv-scaffold
          cp -a /tmp/tv-scaffold/android ./android
          python3 scripts/configure_android.py
      - name: Resolve packages
        run: flutter pub get
      - name: Format
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --reporter expanded
      - name: Build ARMv7 release APK
        run: flutter build apk --release --target-platform android-arm
      - name: Verify native ABI
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -q 'lib/armeabi-v7a/' /tmp/apk-files.txt
          if grep -qE 'lib/(arm64-v8a|x86|x86_64)/' /tmp/apk-files.txt; then
            echo "Unexpected non-ARMv7 native library was packaged."
            exit 1
          fi
          cp "$APK" build/app/outputs/flutter-apk/hyouka-tv-control-armv7.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hyouka-tv-control-armv7
          path: build/app/outputs/flutter-apk/hyouka-tv-control-armv7.apk
          if-no-files-found: error
          retention-days: 14
