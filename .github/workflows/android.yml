name: Hyouka TV Control Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  flutter-ci:
    permissions:
      actions: read
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@242cb422a52c2ef24fd9074e237e04c0ecdc04fb
    with:
      run-analyze: true
      run-tests: true
      check-format: false
      build-apk: true
      target-platform: android-arm
      generate-android: true
      android-project-name: hyouka_tv_control
      android-organization: com.hyouka
      android-setup-script: scripts/configure_android.py
      run-emulator-tests: false
      run-security-audit: true
      fail-on-security-findings: false
      artifact-name: hyouka-tv-control-armv7
      enable-targeted-pr-tests: false
      run-apk-smoke-test: false
      min-coverage-percent: 0
      max-apk-size-mb: 0
      max-apk-entry-size-mb: 0
      forbid-permissions: ''
      fail-on-new-warnings: false
      generate-artifact-attestation: false
